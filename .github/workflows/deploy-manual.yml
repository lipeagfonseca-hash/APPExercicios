# ============================================================================
# Deploy em produção (MANUAL)
# ----------------------------------------------------------------------------
# Só roda quando você clica em "Run workflow" (aba Actions) e só na branch main.
# Cada execução aparece em "Deployments" do repositório, com o link da produção.
#
# SEGREDOS necessários (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       token criado em vercel.com/account/tokens (escopo só deste time)
#   VERCEL_ORG_ID      id do time na Vercel
#   VERCEL_PROJECT_ID  id do projeto na Vercel
# (os dois ids estão em .vercel/project.json no seu computador — arquivo local, fora do git)
#
# Não roda migrations: o banco é compartilhado, então migrations continuam manuais.
# ============================================================================
name: Deploy em produção (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy na Vercel
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Faz o GitHub registrar o deploy (histórico em Code → Deployments).
    environment:
      name: production
      url: ${{ steps.implantar.outputs.url }}

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Conferir segredos
        run: |
          for nome in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!nome}" ]; then echo "::error::Segredo $nome não configurado."; exit 1; fi
          done

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verificar antes de publicar
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-somente-para-build-nao-e-segredo
        run: |
          npx prisma generate
          npm run lint
          npm test

      # As mídias dos exercícios (© Gym visual) não ficam no git; sem elas os GIFs
      # sumiriam da produção. Veja NOTICE.md.
      - name: Baixar mídias dos exercícios
        run: node scripts/fetch-exercise-media.cjs

      - name: Instalar a CLI da Vercel
        run: npm install --global vercel@latest

      - name: Puxar configuração do projeto
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Publicar
        id: implantar
        run: |
          url=$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deploy publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
